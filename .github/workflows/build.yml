name: Build crDroid 7.1.2 - j3xlte by lieco

on:
  workflow_dispatch:

env:
  DEVICE: j3xlte
  DEVICE_DIR: device/samsung/j3xlte
  BRANCH: 7.1
  MANIFEST_URL: https://github.com/crdroidandroid/android.git
  BUILD_TARGET: bacon
  MICROG_PIN_LATEST: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440

steps:
      - name: Checkout workflow repo (local manifest + extra packages)
        uses: actions/checkout@v4

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig bc rsync openjdk-8-jdk imagemagick lib32readline-dev \
            liblz4-tool libssl-dev pngcrush schedtool squashfs-tools \
            ccache libssl-dev libncurses5-dev jq

      - name: Free initial disk space for apt
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240  # Оставим 10 ГБ на корню / для системных утилит и apt
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Check available disk space & RAM
        run: |
          echo "=== Дисковое пространство (df -h) ==="
          df -h
          echo ""
          echo "=== Оперативная память и Swap (free -h) ==="
          free -h

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig bc rsync openjdk-8-jdk imagemagick lib32readline-dev \
            liblz4-tool libssl-dev pngcrush schedtool squashfs-tools \
            ccache libssl-dev libncurses5-dev jq

      - name: Install python2.7 (legacy dependency, missing on 22.04)
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python2.7
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2.7 1
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 2
          curl -sS https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          sudo python2.7 get-pip.py

      - name: Install lib32ncurses5 / libncurses5 (legacy libs, missing on 22.04)
        run: |
          mkdir -p /tmp/legacy-libs && cd /tmp/legacy-libs
          curl -sSLO http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          curl -sSLO http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
          curl -sSLO http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/lib32tinfo5_6.2-0ubuntu2_amd64.deb
          curl -sSLO http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/lib32ncurses5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i ./*.deb || sudo apt-get install -f -y

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Init repo manifest
        run: |
          mkdir -p ~/crdroid && cd ~/crdroid
          ~/bin/repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH }} --depth=1

      - name: Add local manifest
        run: |
          mkdir -p ~/crdroid/.repo/local_manifests
          cp "$GITHUB_WORKSPACE/.repo/local_manifests/j3xlte.xml" \
             ~/crdroid/.repo/local_manifests/j3xlte.xml

      - name: Repo sync
        run: |
          cd ~/crdroid
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Fix lineage*.mk -> crdroid*.mk in device tree
        run: |
          cd ~/crdroid/${{ env.DEVICE_DIR }}
          shopt -s nullglob
          for f in lineage_*.mk; do
            new="crdroid_${f#lineage_}"
            echo "Renaming $f -> $new"
            git mv "$f" "$new" 2>/dev/null || mv "$f" "$new"
            sed -i "s/lineage_${{ env.DEVICE }}/crdroid_${{ env.DEVICE }}/g" "$new"
            sed -i "s/PRODUCT_NAME := lineage_/PRODUCT_NAME := crdroid_/g" "$new"
          done
          grep -rl "lineage_${{ env.DEVICE }}" . 2>/dev/null | while read -r file; do
            sed -i "s/lineage_${{ env.DEVICE }}/crdroid_${{ env.DEVICE }}/g" "$file"
          done

      - name: Fetch microG prebuilts (GmsCore, FakeStore, GsfProxy)
        run: |
          mkdir -p /tmp/microg
          cat << 'EOF' > /tmp/fetch_microg.py
          import sys, os, urllib.request, xml.etree.ElementTree as ET

          outdir = sys.argv[1]
          base = "https://microg.org/fdroid/repo/"
          targets = {
              "com.google.android.gms": "GmsCore.apk",
              "com.android.vending":    "FakeStore.apk",
              "com.google.android.gsf": "GsfProxy.apk",
          }

          with urllib.request.urlopen(base + "index.xml") as r:
              tree = ET.fromstring(r.read())

          for app in tree.findall("application"):
              appid = app.get("id")
              if appid not in targets:
                  continue
              pkg = app.find("package")
              apkname = pkg.find("apkname").text
              dest = os.path.join(outdir, targets[appid])
              print(f"[microG] {appid} -> {apkname}")
              urllib.request.urlretrieve(base + apkname, dest)
          EOF
          python3 /tmp/fetch_microg.py "/tmp/microg"

          mkdir -p ~/crdroid/vendor/extra/apps/GmsCore/prebuilt
          mkdir -p ~/crdroid/vendor/extra/apps/FakeStore/prebuilt
          mkdir -p ~/crdroid/vendor/extra/apps/GsfProxy/prebuilt
          cp /tmp/microg/GmsCore.apk   ~/crdroid/vendor/extra/apps/GmsCore/prebuilt/GmsCore.apk
          cp /tmp/microg/FakeStore.apk ~/crdroid/vendor/extra/apps/FakeStore/prebuilt/FakeStore.apk
          cp /tmp/microg/GsfProxy.apk  ~/crdroid/vendor/extra/apps/GsfProxy/prebuilt/GsfProxy.apk
          ls -lh ~/crdroid/vendor/extra/apps/*/prebuilt/*.apk

      - name: Fetch Aurora Store & Aurora Services prebuilts
        run: |
          set -e
          fetch_latest_gitlab_apk () {
            local project="$1"
            local outfile="$2"
            local url
            url=$(curl -sS "https://gitlab.com/api/v4/projects/${project}/releases?order_by=released_at&sort=desc&per_page=1" \
                  | jq -r '.[0].assets.links[] | select(.name | test("\\.apk$")) | .url' \
                  | head -n1)
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::error::Could not resolve latest .apk asset for $project" >&2
              exit 1
            fi
            echo "[Aurora] $project -> $url"
            curl -sSL "$url" -o "$outfile"
          }

          mkdir -p /tmp/aurora
          fetch_latest_gitlab_apk "AuroraOSS%2FAuroraStore"    /tmp/aurora/AuroraStore.apk
          fetch_latest_gitlab_apk "AuroraOSS%2FAuroraServices" /tmp/aurora/AuroraServices.apk
          curl -sSL "https://gitlab.com/AuroraOSS/AuroraServices/raw/master/app/src/main/assets/permissions_com.aurora.services.xml" \
               -o /tmp/aurora/permissions_com.aurora.services.xml

          mkdir -p ~/crdroid/vendor/extra/apps/AuroraStore/prebuilt
          mkdir -p ~/crdroid/vendor/extra/apps/AuroraServices/prebuilt
          mkdir -p ~/crdroid/vendor/extra/permissions
          cp /tmp/aurora/AuroraStore.apk    ~/crdroid/vendor/extra/apps/AuroraStore/prebuilt/AuroraStore.apk
          cp /tmp/aurora/AuroraServices.apk ~/crdroid/vendor/extra/apps/AuroraServices/prebuilt/AuroraServices.apk
          cp /tmp/aurora/permissions_com.aurora.services.xml \
             ~/crdroid/vendor/extra/permissions/permissions_com.aurora.services.xml
          ls -lh ~/crdroid/vendor/extra/apps/*/prebuilt/*.apk

      - name: Fetch NewPipe prebuilt (latest GitHub release)
        run: |
          set -e
          URL=$(curl -sS "https://api.github.com/repos/TeamNewPipe/NewPipe/releases/latest" \
                | jq -r '.assets[] | select(.name | test("\\.apk$")) | .browser_download_url' \
                | head -n1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Could not resolve latest NewPipe .apk asset" >&2
            exit 1
          fi
          echo "[NewPipe] -> $URL"
          mkdir -p ~/crdroid/vendor/extra/apps/NewPipe/prebuilt
          curl -sSL "$URL" -o ~/crdroid/vendor/extra/apps/NewPipe/prebuilt/NewPipe.apk
          ls -lh ~/crdroid/vendor/extra/apps/NewPipe/prebuilt/NewPipe.apk

      - name: Inject extra packages (microG + Aurora + NewPipe) into device tree
        run: |
          SRC="$GITHUB_WORKSPACE/extra/vendor_extra"
          DST=~/crdroid/vendor/extra

          mkdir -p "$DST/products"
          cp "$SRC/Android.mk" "$DST/Android.mk"
          cp "$SRC/products/extra_packages.mk" "$DST/products/extra_packages.mk"

          for app in GmsCore FakeStore GsfProxy AuroraStore AuroraServices NewPipe; do
            mkdir -p "$DST/apps/$app"
            cp "$SRC/apps/$app/Android.mk" "$DST/apps/$app/Android.mk"
          done

          DEVICE_MK=$(ls ~/crdroid/${{ env.DEVICE_DIR }}/crdroid_${{ env.DEVICE }}.mk 2>/dev/null || true)
          if [ -z "$DEVICE_MK" ]; then
            echo "::error::Could not find crdroid_${{ env.DEVICE }}.mk after the rename step" >&2
            exit 1
          fi
          if ! grep -q "vendor/extra/products/extra_packages.mk" "$DEVICE_MK"; then
            printf '\n# microG + Aurora Store/Services (injected by CI)\n$(call inherit-product, vendor/extra/products/extra_packages.mk)\n' >> "$DEVICE_MK"
            echo "Appended inherit-product line to $DEVICE_MK"
          else
            echo "Inherit-product line already present in $DEVICE_MK"
          fi

      - name: Check for native signature-spoofing support (informational)
        run: |
          MANIFEST=~/crdroid/frameworks/base/core/res/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && grep -q "FAKE_PACKAGE_SIGNATURE" "$MANIFEST"; then
            echo "OK: frameworks/base already declares android.permission.FAKE_PACKAGE_SIGNATURE"
            echo "microG will be able to request signature spoofing at runtime (grant it in Settings after first boot)."
          else
            echo "::warning::FAKE_PACKAGE_SIGNATURE not found in frameworks/base/core/res/AndroidManifest.xml for this branch."
            echo "::warning::microG (GmsCore) will likely install but most Google-account-dependent features will not work without a signature-spoofing patch for this specific tree."
          fi

      - name: Set up ccache
        run: |
          cd ~/crdroid
          echo "USE_CCACHE=1" >> ~/.bashrc
          echo "CCACHE_EXEC=$(which ccache)" >> ~/.bashrc
          ccache -M 20G || true

      - name: Build crDroid for j3xlte
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export JACK_SERVER_VM_ARGUMENTS="-Xmx4g -Dfile.encoding=UTF-8"
          export ANDROID_JACK_VM_ARGS="-Xmx4g -Dfile.encoding=UTF-8"
          export LC_ALL=C
          cd ~/crdroid
          source build/envsetup.sh
          brunch ${{ env.DEVICE }}

      - name: Locate build artifact
        id: artifact
        run: |
          OUT_DIR=~/crdroid/out/target/product/${{ env.DEVICE }}
          ZIP_PATH=$(find "$OUT_DIR" -maxdepth 1 -name "crDroid*${{ env.DEVICE }}*.zip" | head -n1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No output zip found in $OUT_DIR" >&2
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.DEVICE }}-${{ github.run_number }}
          name: crDroid 7.1.2 - ${{ env.DEVICE }} (run #${{ github.run_number }})
          files: ${{ steps.artifact.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build as workflow artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.zip_name }}
          path: ${{ steps.artifact.outputs.zip_path }}
          if-no-files-found: warn
